services:

  db:
    image: postgres:15
    container_name: woofie-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Variable POSTGRES_USER obligatoire dans .env.prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?❌ Variable POSTGRES_PASSWORD obligatoire dans .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:?Variable POSTGRES_DB obligatoire dans .env.prod}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - woofie

  symfony:
    build:
      context: ./server
    container_name: woofie-backend
    environment:
      APP_ENV: prod
      DEFAULT_URI: ${APP_URL:?❌ Variable APP_URL obligatoire dans .env.prod}
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?serverVersion=15&charset=utf8"
      OLLAMA_API_URL: ${OLLAMA_API_URL:?❌ Variable OLLAMA_API_URL obligatoire dans .env.prod}
      OLLAMA_MODEL: ${OLLAMA_MODEL:?Variable OLLAMA_MODEL obligatoire dans .env.prod}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:?Variable OLLAMA_TIMEOUT_SECONDS obligatoire dans .env.prod}
      OLLAMA_MAX_RESPONSE_CHARS: ${OLLAMA_MAX_RESPONSE_CHARS:?Variable OLLAMA_MAX_RESPONSE_CHARS obligatoire dans .env.prod}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:?Variable OLLAMA_NUM_CTX obligatoire dans .env.prod}
      MESSENGER_TRANSPORT_DSN: "sync://"
      APP_SECRET: ${APP_SECRET:?❌ Variable APP_SECRET obligatoire dans .env.prod}
      JWT_SECRET: ${JWT_SECRET:?❌ Variable JWT_SECRET obligatoire dans .env.prod}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-3600}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-1}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:?❌ Variable CORS_ALLOW_ORIGIN obligatoire dans .env.prod}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-5242880}
      UPLOAD_MAX_PIXELS: ${UPLOAD_MAX_PIXELS:-20000000}
      INSEE_API_KEY: ${INSEE_API_KEY:-}
    volumes:
      - uploads:/var/www/html/public/uploads
    expose:
      - "9000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - woofie

  nextjs:
    build:
      context: ./client
      args:
        NEXT_PUBLIC_API_URL: ""
        NEXT_PUBLIC_WS_ENABLED: "false"
    container_name: woofie-frontend
    environment:
      NODE_ENV: production
      INTERNAL_API_BASE: ${INTERNAL_API_BASE:?❌ Variable INTERNAL_API_BASE obligatoire dans .env.prod}
    expose:
      - "3000"
    depends_on:
      - symfony
    restart: unless-stopped
    networks:
      - woofie

  ollama:
    image: ollama/ollama:latest
    container_name: woofie-ollama
    volumes:
      - ollama_data:/root/.ollama
    expose:
      - "11434"
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:?Variable OLLAMA_MODEL obligatoire dans .env.prod}
    restart: unless-stopped
    networks:
      - woofie

  nginx:
    image: nginx:stable-alpine
    container_name: woofie-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      - uploads:/var/www/html/public/uploads:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Variable APP_DOMAIN obligatoire dans .env.prod}
      NGINX_UPLOAD_MAX_SIZE: ${NGINX_UPLOAD_MAX_SIZE:?Variable NGINX_UPLOAD_MAX_SIZE obligatoire dans .env.prod}
      NGINX_ENVSUBST_FILTER: ^(APP_DOMAIN|NGINX_UPLOAD_MAX_SIZE)$$
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
    depends_on:
      - symfony
      - nextjs
    restart: unless-stopped
    networks:
      - woofie

  certbot:
    image: certbot/certbot:latest
    container_name: woofie-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done;'"
    networks:
      - woofie

volumes:
  db_data:
  ollama_data:
  uploads:

networks:
  woofie:
    driver: bridge

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.jwt_secret: '%env(JWT_SECRET)%'
    app.jwt_ttl_seconds: '%env(int:JWT_TTL_SECONDS)%'
    app.auth_cookie_secure: '%env(bool:AUTH_COOKIE_SECURE)%'
    app.cors_allow_origin: '%env(CORS_ALLOW_ORIGIN)%'
    app.upload_max_bytes: '%env(int:UPLOAD_MAX_BYTES)%'
    app.upload_max_pixels: '%env(int:UPLOAD_MAX_PIXELS)%'
    app.ollama_api_url: '%env(OLLAMA_API_URL)%'
    app.ollama_model: '%env(OLLAMA_MODEL)%'
    app.ollama_timeout_seconds: '%env(int:OLLAMA_TIMEOUT_SECONDS)%'
    app.ollama_max_response_chars: '%env(int:OLLAMA_MAX_RESPONSE_CHARS)%'
    app.ollama_num_ctx: '%env(int:OLLAMA_NUM_CTX)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            string $jwtSecret: '%app.jwt_secret%'
            int $jwtTtlSeconds: '%app.jwt_ttl_seconds%'
            bool $authCookieSecure: '%app.auth_cookie_secure%'
            string $corsAllowOrigin: '%app.cors_allow_origin%'
            int $uploadMaxBytes: '%app.upload_max_bytes%'
            int $uploadMaxPixels: '%app.upload_max_pixels%'
            string $ollamaApiUrl: '%app.ollama_api_url%'
            string $ollamaModel: '%app.ollama_model%'
            int $ollamaTimeoutSeconds: '%app.ollama_timeout_seconds%'
            int $ollamaMaxResponseChars: '%app.ollama_max_response_chars%'
            int $ollamaNumCtx: '%app.ollama_num_ctx%'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    App\Service\SiretValidator:
        arguments:
            $inseeApiKey: '%env(default::INSEE_API_KEY)%'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

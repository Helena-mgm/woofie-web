events {}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── 1. HTTP → HTTPS (visiteurs externes avec le domaine) ──────────────
    #       + challenge ACME pour le renouvellement du certificat
    server {
        listen 80;
        server_name woofie.ovh www.woofie.ovh;

        # Certbot webroot challenge (renouvellement auto Let's Encrypt)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Tout le reste → redirection HTTPS
        location / {
            return 301 https://woofie.ovh$request_uri;
        }
    }

    # ── 2. HTTP interne (appels Docker → Docker sans redirection) ──────────
    #       Utilisé par le container nextjs pour les appels SSR/API routes
    #       via INTERNAL_API_BASE=http://nginx
    server {
        listen 80 default_server;
        server_name _;

        client_max_body_size 50M;

        # Uploads (photos chiens, profils...)
        location /uploads/ {
            alias /var/www/html/public/uploads/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # API Symfony (PHP-FPM FastCGI)
        location ~ ^/api(/|$) {
            fastcgi_pass woofie-backend:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_read_timeout 300s;
            fastcgi_send_timeout 300s;
        }

        # Frontend Next.js
        location / {
            proxy_pass http://woofie-frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 60s;
        }
    }

    # ── 3. HTTPS (production, visiteurs externes) ─────────────────────────
    server {
        listen 443 ssl;
        server_name woofie.ovh www.woofie.ovh;

        # Certificats Let's Encrypt
        ssl_certificate     /etc/letsencrypt/live/woofie.ovh/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/woofie.ovh/privkey.pem;

        # Configuration TLS moderne
        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache         shared:SSL:10m;
        ssl_session_timeout       1d;

        # Headers de sécurité
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options           SAMEORIGIN;
        add_header X-Content-Type-Options    nosniff;
        add_header X-XSS-Protection          "1; mode=block";

        client_max_body_size 50M;

        # Uploads (photos chiens, profils...)
        location /uploads/ {
            alias /var/www/html/public/uploads/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Next.js assets et HMR (désactivé en prod mais route conservée)
        location /_next/ {
            proxy_pass http://woofie-frontend:3000/_next/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # API Symfony (PHP-FPM FastCGI)
        location ~ ^/api(/|$) {
            fastcgi_pass woofie-backend:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME    /var/www/html/public/index.php;
            fastcgi_param PATH_INFO          $fastcgi_path_info;
            # Indique à PHP/Symfony que la connexion est HTTPS
            fastcgi_param HTTPS              on;
            fastcgi_param HTTP_X_FORWARDED_PROTO https;
            fastcgi_read_timeout 300s;
            fastcgi_send_timeout 300s;
        }

        # Frontend Next.js
        location / {
            proxy_pass http://woofie-frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade          $http_upgrade;
            proxy_set_header Connection       $connection_upgrade;
            proxy_set_header Host             $host;
            proxy_set_header X-Real-IP        $remote_addr;
            proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_redirect off;
        }
    }
}

events {}

http {
    # Ensure WebSocket upgrade header handling for HMR and other WS endpoints
    map $http_upgrade $connection_upgrade {
      default upgrade;
      ''      close;
    }

    server {
        listen 80;
        server_name localhost;

    # Proxy Next.js application root
    location / {
        proxy_pass http://woofie-frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_redirect off;
    }

    # Explicit location for Next static and HMR websocket path to be safe
    location /_next/ {
        proxy_pass http://woofie-frontend:3000/_next/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_redirect off;
    }

    location /uploads/ {
        alias /var/www/html/public/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ~ ^/api(/|$) {
        fastcgi_pass woofie-backend:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        
        # Augmenter les timeouts pour le streaming Ollama
        fastcgi_read_timeout 300s;
        fastcgi_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    }
}
